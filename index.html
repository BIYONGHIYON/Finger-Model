<!--
=========================================================
1. 문구 수정
    - 스크립트 영역의 TEXT_CONFIG 내부 (line 875 부근)

2. 결과 화면 켜기/끄기
    - 시작 화면의 "결과 화면" 스위치에서 선택
    - 끔: 단어를 계속 선택하는 모드
    - 켬: 5개 단어 선택 후 결과 화면 표시

3. 녹화
    - 카메라 시작과 동시에 30fps 자동 녹화
    - 녹화본에는 카메라 영상 + 손 관절 + 손가락 글씨만 포함
    - 마이크 소리와 기기 스피커에서 재생되는 TTS도 함께 녹음
    - 촬영 화면의 "녹화 종료 · 저장" 버튼으로 저장

4. 폰트 수정
    - 코드에서 Ctrl+F 키를 눌러 'font-family'를 검색
    - 일반 텍스트 폰트 : 상단 스타일 영역의 body { font-family: ... } 부분 수정
    - 영어/강조 폰트 : .selected-word, .word-chip 영역의 font-family 수정

5. 메인 컬러(테마 색상) 수정
    - 상단 스타일 영역 맨 위쪽(line 50)의 :root { ... } 블록
    - --pink, --purple, --cyan 뒤에 있는 색상 코드(예: #ff5f9e)를 변경

6. 웹사이트에 반영
    - 수정 후 저장, GitHub에 commit & push, 약 2분내로 반영됨
=========================================================
-->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <meta name="theme-color" content="#07070c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />
  <title>Happy Birthday</title>

  <style>
    :root {
      --bg: #07070c;
      --fg: #fffaf6;
      --muted: rgba(255, 255, 255, 0.62);
      --glass: rgba(12, 12, 20, 0.38);
      --glass-strong: rgba(12, 12, 20, 0.68);
      --glass-border: rgba(255, 255, 255, 0.16);
      --pink: #ff5f9e;
      --purple: #9879ff;
      --cyan: #65e9ff;
      --green: #8df58b;
      --red: #ff4e67;
      --safe-top: max(18px, env(safe-area-inset-top));
      --safe-bottom: max(18px, env(safe-area-inset-bottom));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #020204;
      color: var(--fg);
      /* 깔끔한 산세리프 폰트로 일괄 적용 */
      font-family: "Helvetica Neue", Arial, "Pretendard", "Noto Sans KR", sans-serif;
    }

    button {
      color: inherit;
      font: inherit;
    }

    /* 🔥 어떤 기기에서든 전체 화면 100%를 무조건 꽉 채우도록 강제 설정 */
    .app {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      margin: 0 !important;
      padding: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 95, 158, 0.18), transparent 30%),
        radial-gradient(circle at 86% 82%, rgba(101, 233, 255, 0.14), transparent 28%),
        linear-gradient(145deg, #08080d, #10101b 55%, #08080d);
    }

    .camera-layer,
    #camera,
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      margin: 0;
      padding: 0;
    }

    .camera-layer {
      z-index: 0;
      opacity: 0;
      background: #050508;
      transition: opacity 600ms ease;
    }

    .camera-layer.active {
      opacity: 1;
    }

    #camera {
      object-fit: cover !important;
      transform: scaleX(-1);
      filter: brightness(0.88) contrast(1.04) saturate(0.96);
    }

    #overlay {
      z-index: 2;
      pointer-events: none;
    }

    .shade {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(2, 2, 6, 0.65) 0%,
          rgba(2, 2, 6, 0.08) 25%,
          rgba(2, 2, 6, 0.02) 55%,
          rgba(2, 2, 6, 0.68) 100%
        ),
        radial-gradient(circle at center, transparent 28%, rgba(0, 0, 0, 0.17));
    }

    .noise {
      position: absolute;
      inset: -50%;
      z-index: 4;
      pointer-events: none;
      opacity: 0.042;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
      animation: noiseMove 260ms steps(2) infinite;
    }

    @keyframes noiseMove {
      0% { transform: translate3d(0, 0, 0); }
      25% { transform: translate3d(2%, -2%, 0); }
      50% { transform: translate3d(-2%, 1%, 0); }
      75% { transform: translate3d(1%, 2%, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }

    .orb {
      position: absolute;
      z-index: 4;
      width: 48vw;
      height: 48vw;
      min-width: 220px;
      min-height: 220px;
      border-radius: 50%;
      filter: blur(68px);
      opacity: 0.2;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .orb.one {
      top: -16%;
      left: -20%;
      background: var(--pink);
      animation: driftOne 8s ease-in-out infinite alternate;
    }

    .orb.two {
      right: -22%;
      bottom: 5%;
      background: var(--cyan);
      animation: driftTwo 9s ease-in-out infinite alternate;
    }

    @keyframes driftOne {
      to { transform: translate(17vw, 15vh) scale(1.2); }
    }

    @keyframes driftTwo {
      to { transform: translate(-15vw, -9vh) scale(0.86); }
    }

    /* 촬영 중에는 배경의 원형 장식을 모두 숨김 */
    .app.camera-mode .orb,
    .app.camera-mode .guide-ring,
    .app.camera-mode .noise {
      display: none;
    }

    .app.camera-mode .shade {
      background: linear-gradient(
        to bottom,
        rgba(2, 2, 6, 0.44) 0%,
        rgba(2, 2, 6, 0.03) 28%,
        rgba(2, 2, 6, 0.01) 64%,
        rgba(2, 2, 6, 0.48) 100%
      );
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      transition:
        opacity 500ms ease,
        visibility 500ms,
        transform 500ms cubic-bezier(.2, .8, .2, 1);
    }

    .screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(1.025);
    }

    .intro {
      justify-content: flex-end;
      padding:
        calc(var(--safe-top) + 70px)
        22px
        calc(var(--safe-bottom) + 25px);
    }

    .intro-decoration {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .eyebrow {
      margin-bottom: 13px;
      color: rgba(255, 255, 255, 0.58);
      font-size: 11px;
      font-weight: 720;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .intro h1 {
      max-width: 520px;
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(55px, 16vw, 92px);
      font-weight: 700;
      line-height: 0.83;
      letter-spacing: -0.065em;
    }

    .intro h1 em {
      display: block;
      margin-left: 0.53em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.84);
      text-shadow: 0 0 38px rgba(255, 95, 158, 0.18);
    }

    .intro-copy {
      max-width: 450px;
      margin: 21px 0 25px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      word-break: keep-all;
    }

    .primary-button {
      position: relative;
      width: 100%;
      min-height: 58px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      color: #0a0910;
      font-size: 15px;
      font-weight: 780;
      cursor: pointer;
      box-shadow:
        0 14px 38px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: transform 150ms ease, opacity 200ms ease;
    }

    .primary-button::before {
      content: "";
      position: absolute;
      inset: -80% -20%;
      background: linear-gradient(
        115deg,
        transparent 34%,
        rgba(255, 95, 158, 0.28) 45%,
        rgba(101, 233, 255, 0.32) 54%,
        transparent 66%
      );
      transform: translateX(-72%);
      animation: buttonShine 3.2s ease-in-out infinite;
    }

    .primary-button span {
      position: relative;
      z-index: 1;
    }

    .primary-button:active {
      transform: scale(0.98);
    }

    .primary-button:disabled {
      opacity: 0.62;
      cursor: wait;
    }

    .intro-settings {
      position: absolute;
      top: calc(var(--safe-top) + 8px);
      left: 14px;
      z-index: 15;
      width: auto;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 9px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background: rgba(5, 5, 10, 0.7);
      cursor: pointer;
      user-select: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 7px 20px rgba(0, 0, 0, 0.2);
    }

    .toggle-copy {
      display: block;
      min-width: 0;
    }

    .toggle-copy strong {
      display: block;
      font-size: 10px;
      font-weight: 760;
      line-height: 1;
      white-space: nowrap;
    }

    .toggle-copy small {
      display: none;
    }

    .toggle-row input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .toggle-switch {
      position: relative;
      flex: 0 0 auto;
      width: 32px;
      height: 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.11);
      transition: 220ms ease;
    }

    .toggle-switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.3);
      transition: transform 220ms cubic-bezier(.2, .8, .2, 1);
    }

    .toggle-row input:checked + .toggle-switch {
      border-color: rgba(255, 95, 158, 0.66);
      background: linear-gradient(135deg, var(--pink), var(--purple));
    }

    .toggle-row input:checked + .toggle-switch::after {
      transform: translateX(14px);
    }

    @keyframes buttonShine {
      0%, 25% { transform: translateX(-72%); }
      65%, 100% { transform: translateX(72%); }
    }

    .experience {
      justify-content: space-between;
      align-items: center;
      padding:
        calc(var(--safe-top) + 65px)
        17px
        calc(var(--safe-bottom) + 15px);
    }

    .center-stage {
      position: relative;
      display: grid;
      place-items: center;
      width: min(82vw, 420px);
      aspect-ratio: 1;
      pointer-events: none;
      margin-top: 40px;
    }

    .guide-ring {
      position: absolute;
      width: 78%;
      aspect-ratio: 1;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      box-shadow:
        inset 0 0 55px rgba(255, 255, 255, 0.025),
        0 0 70px rgba(152, 121, 255, 0.07);
      opacity: 0.58;
    }

    .guide-ring::before,
    .guide-ring::after {
      content: "";
      position: absolute;
      inset: -8px;
      border: 1px solid transparent;
      border-top-color: rgba(101, 233, 255, 0.55);
      border-right-color: rgba(255, 95, 158, 0.45);
      border-radius: 50%;
      animation: spin 5.2s linear infinite;
    }

    .guide-ring::after {
      inset: 15px;
      border-top-color: rgba(255, 255, 255, 0.27);
      border-right-color: transparent;
      animation-duration: 7.5s;
      animation-direction: reverse;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .selected-word {
      position: relative;
      z-index: 2;
      min-height: 1.05em;
      max-width: 94vw;
      padding: 0 10px;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(61px, 19vw, 112px);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.065em;
      text-align: center;
      /* 그림자 삭제됨 */
      opacity: 0;
      transform: scale(0.72);
    }

    .selected-word.show {
      animation: wordPop 900ms cubic-bezier(.16, .82, .22, 1) both;
    }

    @keyframes wordPop {
      0% {
        opacity: 0;
        transform: scale(0.52) rotate(-8deg);
        filter: blur(12px);
      }
      42% {
        opacity: 1;
        transform: scale(1.09) rotate(1deg);
        filter: blur(0);
      }
      76% {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
      100% {
        opacity: 0;
        transform: scale(0.96);
      }
    }

    .record-controls {
      position: absolute;
      top: calc(var(--safe-top) + 10px);
      right: 14px;
      z-index: 22;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .record-controls.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-8px);
    }

    .record-button,
    .save-button {
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: rgba(5, 5, 10, 0.72);
      color: #fff;
      font-size: 12px;
      font-weight: 760;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
    }

    .record-button.recording::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 5px rgba(255, 78, 103, 0.12);
      animation: recordingPulse 1.2s ease-in-out infinite;
    }

    .record-button:disabled,
    .save-button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    @keyframes recordingPulse {
      50% { opacity: 0.45; }
    }

    .complete-actions {
      display: grid;
      gap: 10px;
    }

    .save-button {
      width: 100%;
      min-height: 54px;
      background: rgba(7, 7, 13, 0.64);
    }

    .save-button[hidden] {
      display: none;
    }

    .bottom-panel {
      width: 100%;
      max-width: 540px;
      padding: 13px 14px 12px;
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      background: rgba(6, 6, 11, 0.3);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .word-list {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .word-chip {
      min-width: 0;
      padding: 9px 3px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.055);
      color: rgba(255, 255, 255, 0.37);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(10px, 3vw, 13px);
      text-align: center;
      transition: 300ms ease;
    }

    .word-chip.active {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.38);
      background:
        linear-gradient(
          135deg,
          rgba(255, 95, 158, 0.23),
          rgba(101, 233, 255, 0.12)
        ),
        rgba(255, 255, 255, 0.07);
      transform: translateY(-2px);
    }

    .progress {
      height: 3px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan));
      box-shadow: 0 0 14px rgba(101, 233, 255, 0.52);
      transition: width 350ms ease;
    }

    .complete {
      align-items: center;
      justify-content: flex-end;
      padding:
        calc(var(--safe-top) + 80px)
        22px
        calc(var(--safe-bottom) + 24px);
      text-align: center;
      background:
        radial-gradient(circle at 50% 39%, rgba(255, 95, 158, 0.14), transparent 31%),
        linear-gradient(to bottom, rgba(7, 7, 12, 0.05), rgba(7, 7, 12, 0.84));
    }

    .complete-copy {
      width: 100%;
      max-width: 520px;
    }

    .complete h2 {
      margin: 0 0 18px;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(49px, 14vw, 82px);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.06em;
      /* 그림자 삭제됨 */
    }

    .complete p {
      margin: 0 0 24px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 14px;
      line-height: 1.65;
    }

    .flash {
      position: fixed;
      inset: 0;
      z-index: 35;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.82), transparent 66%);
    }

    .flash.play {
      animation: flash 520ms ease-out;
    }

    @keyframes flash {
      0% { opacity: 0; }
      18% { opacity: 0.52; }
      100% { opacity: 0; }
    }

    .particle {
      position: fixed;
      z-index: 42;
      width: 7px;
      height: 12px;
      border-radius: 999px;
      pointer-events: none;
      animation: particleFly var(--duration, 900ms) cubic-bezier(.12, .75, .22, 1) forwards;
    }

    @keyframes particleFly {
      0% {
        opacity: 0;
        transform: translate3d(var(--x0), var(--y0), 0) scale(0.2) rotate(0);
      }
      12% { opacity: 1; }
      100% {
        opacity: 0;
        transform:
          translate3d(var(--x1), var(--y1), 0)
          scale(1.1)
          rotate(var(--rot));
      }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 18px);
      z-index: 50;
      width: max-content;
      max-width: calc(100vw - 36px);
      padding: 11px 15px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: rgba(5, 5, 9, 0.82);
      color: rgba(255, 255, 255, 0.88);
      font-size: 12px;
      text-align: center;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      opacity: 0;
      transform: translate(-50%, 12px);
      transition: 250ms ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* 반응형 크기 제한 코드 완전히 삭제됨 */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="camera-layer" id="cameraLayer">
      <video id="camera" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="shade"></div>
    <div class="noise"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>

    <!-- 숨김 처리(hidden) 됨 -->
    <section class="screen intro hidden" id="introScreen">
      <h1 id="ui-intro-title">
        <span id="ui-intro-main"></span>
        <em id="ui-intro-sub"></em>
      </h1>

      <p class="intro-copy" id="ui-intro-copy"></p>

      <div class="intro-settings">
        <label class="toggle-row" for="resultToggle">
          <span class="toggle-copy">
            <strong>결과 화면</strong>
          </span>
          <input type="checkbox" id="resultToggle" />
          <span class="toggle-switch" aria-hidden="true"></span>
        </label>
      </div>

      <button class="primary-button" id="startButton">
        <span id="ui-start-btn"></span>
      </button>
    </section>

    <section class="screen experience hidden" id="experienceScreen">
      <div class="record-controls hidden" id="recordControls">
        <button class="record-button" id="recordButton" type="button">
          녹화 준비 중
        </button>
      </div>

      <div class="center-stage">
        <strong class="selected-word" id="selectedWord"></strong>
      </div>

      <div class="bottom-panel">
        <div class="word-list">
          <div class="word-chip" data-word="i">i</div>
          <div class="word-chip" data-word="love">love</div>
          <div class="word-chip" data-word="hooonkyu">hooonkyu</div>
          <div class="word-chip" data-word="so">so</div>
          <div class="word-chip" data-word="much">much</div>
        </div>

        <div class="progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </section>

    <section class="screen complete hidden" id="completeScreen">
      <div class="complete-copy">
        <div class="eyebrow" id="ui-complete-eyebrow"></div>
        <h2 id="ui-complete-title"></h2>
        <p id="ui-complete-copy"></p>

        <div class="complete-actions">
          <button class="save-button" id="saveRecordingButton" type="button" hidden>
            영상 저장하기
          </button>

          <button class="primary-button" id="restartButton">
            <span id="ui-restart-btn"></span>
          </button>
        </div>
      </div>
    </section>

    <canvas id="inferenceCanvas" hidden></canvas>
    <canvas id="recordingCanvas" hidden></canvas>
    <canvas id="recordingOverlayCanvas" hidden></canvas>
    <div class="flash" id="flash"></div>
    <div class="toast" id="toast"></div>
  </main>

  <script type="module">
    const TEXT_CONFIG = {
      introMain: "원하는",//시작화면 흰색 제목
      introSub: "멘트 작성1",//시작화면 이탤릭 제목
      introCopy: "멘트 작성2",//시작화면 하단 작은 글씨
      startBtn: "카메라 시작하기",//시작버튼
      completeEyebrow: "멘트 작성3",//결과화면 제목 위 작은 글씨
      completeTitle: "i love<br />hooonkyu<br />so much",//결과화면 제목-br은 줄바꿈임
      completeCopy: "멘트 작성4",//결과화면 제목 아래 작은 글씨
      restartBtn: "다시 시작하기",
      loadingText: "카메라와 모델 준비 중..."
    };

    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/+esm";

    "use strict";

    const CONFIG = {
      endlessMode: true,
      recordingFps: 30,
      recordingLongSide: 960,
      recordingVideoBitsPerSecond: 4_500_000,
      recordingAudioBitsPerSecond: 192_000,
      ttsVolume: 1,
      modelUrl:
        "https://storage.googleapis.com/mediapipe-models/" +
        "hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

      wasmRoot:
        "https://cdn.jsdelivr.net/npm/" +
        "@mediapipe/tasks-vision@0.10.35/wasm",

      assignments: {
        Left: [
          { tip: 16, word: "much", color: "#ff4e67" },
          { tip: 12, word: "so", color: "#8df58b" },
          { tip: 8, word: "hooonkyu", color: "#7f82ff" }
        ],
        Right: [
          { tip: 16, word: "", color: "#ff77a9" },
          { tip: 12, word: "i", color: "#ff5f9e" },
          { tip: 8, word: "love", color: "#65e9ff" }
        ]
      },

      allWords: ["i", "love", "hooonkyu", "so", "much"],

      pinchOnRatio: 0.36,
      pinchOffRatio: 0.52,

      stableFrames: 3,

      inferenceIntervalMs: 100,

      inferenceLongSide: 384,

      completeDelayMs: 850
    };

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [17, 18], [18, 19], [19, 20],
      [0, 17]
    ];

    const $ = (selector) => document.querySelector(selector);

    const elements = {
      app: $(".app"),
      camera: $("#camera"),
      cameraLayer: $("#cameraLayer"),
      overlay: $("#overlay"),
      inferenceCanvas: $("#inferenceCanvas"),
      recordingCanvas: $("#recordingCanvas"),
      recordingOverlayCanvas: $("#recordingOverlayCanvas"),

      introScreen: $("#introScreen"),
      experienceScreen: $("#experienceScreen"),
      completeScreen: $("#completeScreen"),

      startButton: $("#startButton"),
      restartButton: $("#restartButton"),
      resultToggle: $("#resultToggle"),
      recordControls: $("#recordControls"),
      recordButton: $("#recordButton"),
      saveRecordingButton: $("#saveRecordingButton"),

      selectedWord: $("#selectedWord"),
      progressFill: $("#progressFill"),
      wordChips: [...document.querySelectorAll(".word-chip")],

      flash: $("#flash"),
      toast: $("#toast")
    };

    $("#ui-intro-main").innerHTML = TEXT_CONFIG.introMain;
    $("#ui-intro-sub").innerHTML = TEXT_CONFIG.introSub;
    $("#ui-intro-copy").innerHTML = TEXT_CONFIG.introCopy;
    $("#ui-start-btn").innerHTML = TEXT_CONFIG.startBtn;
    $("#ui-complete-eyebrow").innerHTML = TEXT_CONFIG.completeEyebrow;
    $("#ui-complete-title").innerHTML = TEXT_CONFIG.completeTitle;
    $("#ui-complete-copy").innerHTML = TEXT_CONFIG.completeCopy;
    $("#ui-restart-btn").innerHTML = TEXT_CONFIG.restartBtn;

    const overlayContext = elements.overlay.getContext("2d");
    const inferenceContext = elements.inferenceCanvas.getContext("2d", {
      alpha: false,
      desynchronized: true
    });

    const recordingContext = elements.recordingCanvas.getContext("2d", {
      alpha: false,
      desynchronized: true
    });

    const recordingOverlayContext =
      elements.recordingOverlayCanvas.getContext("2d", {
        alpha: true,
        desynchronized: true
      });

    const state = {
      landmarker: null,
      stream: null,
      running: false,
      inferenceBusy: false,
      lastInferenceAt: 0,
      lastVideoTime: -1,
      overlayWidth: 0,
      overlayHeight: 0,
      detectedHands: 0,
      activatedWords: new Set(),
      pinchStates: new Map(),
      completing: false,
      selectedWordTimer: null,
      completeTimer: null,
      mediaRecorder: null,
      recordingStream: null,
      recordingChunks: [],
      recordingFrameId: null,
      recordingFrameMode: "",
      recordingTimerId: null,
      recordingBlob: null,
      recordingUrl: null,
      recordingMimeType: "",
      recordingStartedAt: 0,
      lastRecordingDrawAt: 0,
      finalizeRecordingPromise: null,
      geometrySignature: "",
      geometryWarmupFrames: 0,
      latestHandResults: []
    };

    let wakeLock = null;

    function setAudioSessionType(type) {
      try {
        if (navigator.audioSession && "type" in navigator.audioSession) {
          navigator.audioSession.type = type;
          return true;
        }
      } catch (error) {
        console.warn(`오디오 세션을 ${type}(으)로 변경하지 못했습니다.`, error);
      }

      return false;
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn(err);
      }
    }

    function showScreen(name) {
      const screens = {
        intro: elements.introScreen,
        experience: elements.experienceScreen,
        complete: elements.completeScreen
      };

      Object.entries(screens).forEach(([key, screen]) => {
        screen.classList.toggle("hidden", key !== name);
      });

      const isCameraMode = name === "experience";
      elements.app.classList.toggle("camera-mode", isCameraMode);
      elements.recordControls.classList.toggle("hidden", !isCameraMode);
    }

    function showToast(message, duration = 2800) {
      elements.toast.textContent = message;
      elements.toast.classList.add("show");

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {
        elements.toast.classList.remove("show");
      }, duration);
    }

    function syncResultMode() {
      CONFIG.endlessMode = !elements.resultToggle.checked;
      $(".bottom-panel").style.display = CONFIG.endlessMode ? "none" : "block";
    }

    function getSupportedRecordingMimeType() {
      if (!("MediaRecorder" in window)) {
        return "";
      }

      const candidates = [
        "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
        "video/mp4",
        "video/webm;codecs=vp9,opus",
        "video/webm;codecs=vp8,opus",
        "video/webm"
      ];

      if (typeof MediaRecorder.isTypeSupported !== "function") {
        return "";
      }

      return candidates.find((type) => MediaRecorder.isTypeSupported(type)) ?? "";
    }

    function configureRecordingCanvas() {
      const width = Math.max(1, state.overlayWidth);
      const height = Math.max(1, state.overlayHeight);

      if (!width || !height) {
        return false;
      }

      const longSide = Math.min(
        CONFIG.recordingLongSide,
        Math.max(width, height) * Math.min(window.devicePixelRatio || 1, 2)
      );
      const scale = longSide / Math.max(width, height);

      const makeEven = (value) => Math.max(2, Math.round(value / 2) * 2);

      const canvasWidth = makeEven(width * scale);
      const canvasHeight = makeEven(height * scale);

      elements.recordingCanvas.width = canvasWidth;
      elements.recordingCanvas.height = canvasHeight;
      elements.recordingOverlayCanvas.width = canvasWidth;
      elements.recordingOverlayCanvas.height = canvasHeight;

      refreshRecordingOverlay();
      return true;
    }

    function cancelRecordingFrameLoop() {
      if (
        state.recordingFrameMode === "video" &&
        state.recordingFrameId !== null &&
        typeof elements.camera.cancelVideoFrameCallback === "function"
      ) {
        elements.camera.cancelVideoFrameCallback(
          state.recordingFrameId
        );
      } else if (
        state.recordingFrameMode === "raf" &&
        state.recordingFrameId !== null
      ) {
        cancelAnimationFrame(state.recordingFrameId);
      }

      if (state.recordingTimerId !== null) {
        clearTimeout(state.recordingTimerId);
      }

      state.recordingFrameId = null;
      state.recordingTimerId = null;
      state.recordingFrameMode = "";
      state.lastRecordingDrawAt = 0;
    }

    function scheduleNextRecordingFrame() {
      const recorder = state.mediaRecorder;

      if (!recorder || recorder.state !== "recording") {
        cancelRecordingFrameLoop();
        return;
      }

      if (
        typeof elements.camera.requestVideoFrameCallback === "function"
      ) {
        state.recordingFrameMode = "video";
        state.recordingFrameId =
          elements.camera.requestVideoFrameCallback(
            drawRecordingFrame
          );
        return;
      }

      state.recordingFrameMode = "raf";
      state.recordingTimerId = setTimeout(() => {
        state.recordingTimerId = null;
        state.recordingFrameId = requestAnimationFrame(
          drawRecordingFrame
        );
      }, 1000 / CONFIG.recordingFps);
    }

    function drawRecordingFrame(timestamp = performance.now()) {
      const recorder = state.mediaRecorder;

      if (!recorder || recorder.state !== "recording") {
        cancelRecordingFrameLoop();
        return;
      }

      const frameInterval = 1000 / CONFIG.recordingFps;

      if (
        state.lastRecordingDrawAt &&
        timestamp - state.lastRecordingDrawAt < frameInterval - 1
      ) {
        scheduleNextRecordingFrame();
        return;
      }

      state.lastRecordingDrawAt = timestamp;

      const targetWidth = elements.recordingCanvas.width;
      const targetHeight = elements.recordingCanvas.height;
      const videoWidth = elements.camera.videoWidth;
      const videoHeight = elements.camera.videoHeight;

      if (targetWidth && targetHeight && videoWidth && videoHeight) {
        const scale = Math.max(
          targetWidth / videoWidth,
          targetHeight / videoHeight
        );
        const drawWidth = videoWidth * scale;
        const drawHeight = videoHeight * scale;
        const drawX = (targetWidth - drawWidth) / 2;
        const drawY = (targetHeight - drawHeight) / 2;

        recordingContext.save();
        recordingContext.fillStyle = "#000";
        recordingContext.fillRect(
          0,
          0,
          targetWidth,
          targetHeight
        );

        recordingContext.translate(targetWidth, 0);
        recordingContext.scale(-1, 1);
        recordingContext.drawImage(
          elements.camera,
          drawX,
          drawY,
          drawWidth,
          drawHeight
        );
        recordingContext.restore();

        recordingContext.drawImage(
          elements.recordingOverlayCanvas,
          0,
          0
        );
      }

      scheduleNextRecordingFrame();
    }

    function clearPreviousRecording() {
      if (state.recordingUrl) {
        URL.revokeObjectURL(state.recordingUrl);
      }

      state.recordingBlob = null;
      state.recordingUrl = null;
      elements.saveRecordingButton.hidden = true;
      elements.saveRecordingButton.disabled = false;
      elements.saveRecordingButton.textContent = "영상 저장하기";
    }

    async function startRecording() {
      if (state.mediaRecorder?.state === "recording") {
        return;
      }

      if (!elements.recordingCanvas.captureStream || !("MediaRecorder" in window)) {
        elements.recordButton.textContent = "이 브라우저는 녹화 미지원";
        elements.recordButton.disabled = true;
        showToast("현재 브라우저에서는 영상 녹화를 지원하지 않습니다.", 4200);
        return;
      }

      clearPreviousRecording();

      if (!configureRecordingCanvas()) {
        showToast("녹화 화면을 준비하지 못했습니다.");
        return;
      }

      const mimeType = getSupportedRecordingMimeType();
      const stream =
        elements.recordingCanvas.captureStream(
          CONFIG.recordingFps
        );
      const videoTrack = stream.getVideoTracks()[0];
      if (videoTrack) {
        videoTrack.contentHint = "motion";
      }

      const microphoneTrack = state.stream?.getAudioTracks?.()[0];
      if (microphoneTrack) {
        stream.addTrack(microphoneTrack.clone());
      }

      const options = mimeType
        ? {
            mimeType,
            videoBitsPerSecond:
              CONFIG.recordingVideoBitsPerSecond,
            audioBitsPerSecond:
              CONFIG.recordingAudioBitsPerSecond
          }
        : {
            videoBitsPerSecond:
              CONFIG.recordingVideoBitsPerSecond,
            audioBitsPerSecond:
              CONFIG.recordingAudioBitsPerSecond
          };

      let recorder;

      try {
        recorder = new MediaRecorder(stream, options);
      } catch (error) {
        console.error(error);
        stream.getTracks().forEach((track) => track.stop());
        elements.recordButton.textContent = "녹화 시작 실패";
        showToast("이 기기에서 녹화를 시작할 수 없습니다.", 4200);
        return;
      }

      state.mediaRecorder = recorder;
      state.recordingStream = stream;
      state.recordingChunks = [];
      state.recordingMimeType = recorder.mimeType || mimeType || "video/webm";
      state.recordingStartedAt = Date.now();
      state.finalizeRecordingPromise = null;

      recorder.addEventListener("dataavailable", (event) => {
        if (event.data?.size) {
          state.recordingChunks.push(event.data);
        }
      });

      recorder.addEventListener("stop", () => {
        const blob = new Blob(state.recordingChunks, {
          type: state.recordingMimeType
        });

        state.recordingBlob = blob.size ? blob : null;
        state.recordingUrl = state.recordingBlob
          ? URL.createObjectURL(state.recordingBlob)
          : null;

        state.recordingStream?.getTracks().forEach((track) => track.stop());
        state.recordingStream = null;
        state.mediaRecorder = null;
        state.recordingChunks = [];

        cancelRecordingFrameLoop();

        elements.recordButton.classList.remove("recording");
        elements.recordButton.disabled = false;
        elements.recordButton.textContent = state.recordingBlob
          ? "영상 저장하기"
          : "녹화 다시 시작";

        elements.saveRecordingButton.hidden = !state.recordingBlob;
        elements.saveRecordingButton.disabled = false;
        elements.saveRecordingButton.textContent = "영상 저장하기";
      }, { once: true });

      recorder.start(1000);
      state.lastRecordingDrawAt = 0;
      refreshRecordingOverlay();
      elements.recordButton.disabled = false;
      elements.recordButton.classList.add("recording");
      elements.recordButton.textContent = "녹화 종료 · 저장";
      drawRecordingFrame();
    }

    function stopRecording() {
      const recorder = state.mediaRecorder;

      if (!recorder || recorder.state === "inactive") {
        return Promise.resolve(state.recordingBlob);
      }

      if (state.finalizeRecordingPromise) {
        return state.finalizeRecordingPromise;
      }

      elements.recordButton.disabled = true;
      elements.recordButton.textContent = "영상 처리 중...";
      elements.saveRecordingButton.hidden = false;
      elements.saveRecordingButton.disabled = true;
      elements.saveRecordingButton.textContent = "영상 처리 중...";

      state.finalizeRecordingPromise = new Promise((resolve) => {
        recorder.addEventListener("stop", () => {
          state.finalizeRecordingPromise = null;
          resolve(state.recordingBlob);
        }, { once: true });

        try {
          recorder.requestData();
        } catch (error) {
          console.warn(error);
        }

        recorder.stop();
      });

      return state.finalizeRecordingPromise;
    }

    function downloadRecording() {
      if (!state.recordingBlob || !state.recordingUrl) {
        showToast("저장할 영상이 아직 준비되지 않았습니다.");
        return;
      }

      const isMp4 = state.recordingBlob.type.includes("mp4");
      const extension = isMp4 ? "mp4" : "webm";
      const date = new Date();
      const stamp = [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0"),
        "-",
        String(date.getHours()).padStart(2, "0"),
        String(date.getMinutes()).padStart(2, "0"),
        String(date.getSeconds()).padStart(2, "0")
      ].join("");

      const link = document.createElement("a");
      link.href = state.recordingUrl;
      link.download = `happy-birthday-${stamp}.${extension}`;
      link.rel = "noopener";
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast("영상을 저장했습니다.");
    }

    async function stopAndDownloadRecording() {
      if (state.mediaRecorder?.state === "recording") {
        await stopRecording();
        downloadRecording();
        return;
      }

      if (state.recordingBlob) {
        downloadRecording();
        return;
      }

      await startRecording();
    }

    function resizeOverlay() {
      const rect = elements.overlay.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      state.overlayWidth = rect.width;
      state.overlayHeight = rect.height;

      elements.overlay.width = Math.round(rect.width * dpr);
      elements.overlay.height = Math.round(rect.height * dpr);
      elements.overlay.style.width = `${rect.width}px`;
      elements.overlay.style.height = `${rect.height}px`;

      overlayContext.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (!state.mediaRecorder || state.mediaRecorder.state === "inactive") {
        configureRecordingCanvas();
      }
    }

    function getGeometrySignature() {
      const cameraRect = elements.camera.getBoundingClientRect();
      const overlayRect = elements.overlay.getBoundingClientRect();

      return [
        elements.camera.videoWidth,
        elements.camera.videoHeight,
        Math.round(cameraRect.left * 10),
        Math.round(cameraRect.top * 10),
        Math.round(cameraRect.width * 10),
        Math.round(cameraRect.height * 10),
        Math.round(overlayRect.left * 10),
        Math.round(overlayRect.top * 10),
        Math.round(overlayRect.width * 10),
        Math.round(overlayRect.height * 10)
      ].join(":");
    }

    function syncCameraGeometry(force = false) {
      if (!elements.camera.videoWidth || !elements.camera.videoHeight) {
        return false;
      }

      const signature = getGeometrySignature();

      if (!force && signature === state.geometrySignature) {
        return false;
      }

      state.geometrySignature = signature;
      resizeOverlay();
      resizeInferenceCanvas();
      return true;
    }

    async function waitForStableCameraGeometry() {
      await new Promise((resolve) => {
        if (typeof elements.camera.requestVideoFrameCallback !== "function") {
          setTimeout(resolve, 180);
          return;
        }

        let remainingFrames = 3;

        const waitNextFrame = () => {
          elements.camera.requestVideoFrameCallback(() => {
            remainingFrames -= 1;

            if (remainingFrames <= 0) {
              resolve();
              return;
            }

            waitNextFrame();
          });
        };

        waitNextFrame();
      });

      await new Promise((resolve) => {
        requestAnimationFrame(() => requestAnimationFrame(resolve));
      });

      syncCameraGeometry(true);
      state.geometryWarmupFrames = 18;
    }

    function clearOverlay() {
      overlayContext.clearRect(
        0,
        0,
        state.overlayWidth,
        state.overlayHeight
      );
    }

    async function createHandLandmarker() {
      if (state.landmarker) {
        return state.landmarker;
      }

      const vision = await FilesetResolver.forVisionTasks(CONFIG.wasmRoot);

      const commonOptions = {
        runningMode: "VIDEO",
        numHands: 2,
        minHandDetectionConfidence: 0.55,
        minHandPresenceConfidence: 0.55,
        minTrackingConfidence: 0.5
      };

      try {
        state.landmarker = await HandLandmarker.createFromOptions(
          vision,
          {
            ...commonOptions,
            baseOptions: {
              modelAssetPath: CONFIG.modelUrl,
              delegate: "GPU"
            }
          }
        );
      } catch (gpuError) {
        console.warn(gpuError);

        state.landmarker = await HandLandmarker.createFromOptions(
          vision,
          {
            ...commonOptions,
            baseOptions: {
              modelAssetPath: CONFIG.modelUrl,
              delegate: "CPU"
            }
          }
        );
      }

      return state.landmarker;
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("이 브라우저에서는 카메라를 사용할 수 없습니다.");
      }
      setAudioSessionType("play-and-record");

      /* 🔥 기기가 가로형(노트북)인지 세로형(모바일)인지 파악하여 최적의 해상도 설정 */
      const isPortrait = window.innerHeight > window.innerWidth;

      state.stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: { ideal: 1 },
          sampleRate: { ideal: 48000 },
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        },
        video: {
          facingMode: "user",
          width: { ideal: isPortrait ? 1080 : 1920 },
          height: { ideal: isPortrait ? 1920 : 1080 },
          frameRate: {
            ideal: CONFIG.recordingFps,
            max: CONFIG.recordingFps
          }
        }
      });

      setAudioSessionType("playback");

      try {
        const videoTrack = state.stream.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities();
        try {
          await videoTrack.applyConstraints({
            frameRate: { ideal: CONFIG.recordingFps, max: CONFIG.recordingFps }
          });
        } catch (frameRateError) {
          console.warn("30fps 카메라 제약을 적용하지 못했습니다.", frameRateError);
        }
        
        const constraints = { advanced: [] };
        let hasConstraints = false;

        /* 확대(Zoom) 방지 로직 유지 */
        if (capabilities.zoom) {
          constraints.advanced.push({ zoom: capabilities.zoom.min });
          hasConstraints = true;
        }

        if (hasConstraints) {
          await videoTrack.applyConstraints(constraints);
        }
      } catch (e) {
        console.warn(e);
      }

      elements.camera.srcObject = state.stream;

      await new Promise((resolve) => {
        if (elements.camera.readyState >= 2) {
          resolve();
          return;
        }

        elements.camera.addEventListener(
          "loadedmetadata",
          resolve,
          { once: true }
        );
      });

      await elements.camera.play();

      elements.cameraLayer.classList.add("active");
      await waitForStableCameraGeometry();
    }

    function resizeInferenceCanvas() {
      const sourceWidth = elements.camera.videoWidth;
      const sourceHeight = elements.camera.videoHeight;

      if (!sourceWidth || !sourceHeight) {
        return;
      }

      const scale = Math.min(
        1,
        CONFIG.inferenceLongSide / Math.max(sourceWidth, sourceHeight)
      );

      elements.inferenceCanvas.width = Math.max(
        1,
        Math.round(sourceWidth * scale)
      );

      elements.inferenceCanvas.height = Math.max(
        1,
        Math.round(sourceHeight * scale)
      );
    }

    function drawMirroredInferenceFrame() {
      const width = elements.inferenceCanvas.width;
      const height = elements.inferenceCanvas.height;

      if (!width || !height) {
        return false;
      }

      inferenceContext.save();
      inferenceContext.fillStyle = "#000";
      inferenceContext.fillRect(0, 0, width, height);

      inferenceContext.translate(width, 0);
      inferenceContext.scale(-1, 1);
      inferenceContext.drawImage(
        elements.camera,
        0,
        0,
        width,
        height
      );

      inferenceContext.restore();
      return true;
    }

    function getDisplayMetrics() {
      const videoWidth = elements.camera.videoWidth;
      const videoHeight = elements.camera.videoHeight;
      const cameraRect = elements.camera.getBoundingClientRect();
      const overlayRect = elements.overlay.getBoundingClientRect();
      const displayWidth = cameraRect.width || state.overlayWidth;
      const displayHeight = cameraRect.height || state.overlayHeight;

      const scale = Math.max(
        displayWidth / videoWidth,
        displayHeight / videoHeight
      );

      const renderedWidth = videoWidth * scale;
      const renderedHeight = videoHeight * scale;

      return {
        renderedWidth,
        renderedHeight,
        offsetX:
          cameraRect.left - overlayRect.left +
          (displayWidth - renderedWidth) / 2,
        offsetY:
          cameraRect.top - overlayRect.top +
          (displayHeight - renderedHeight) / 2
      };
    }

    function landmarkToScreen(landmark, metrics) {
      return {
        x: metrics.offsetX + landmark.x * metrics.renderedWidth,
        y: metrics.offsetY + landmark.y * metrics.renderedHeight
      };
    }

    function distance3D(a, b) {
      return Math.hypot(
        a.x - b.x,
        a.y - b.y,
        (a.z || 0) - (b.z || 0)
      );
    }

    function getPalmScale(landmarks) {
      const palmWidth = distance3D(landmarks[5], landmarks[17]);
      const palmLength = distance3D(landmarks[0], landmarks[9]);

      return Math.max(
        (palmWidth + palmLength) / 2,
        0.0001
      );
    }

    function normalizeHandName(categoryName) {
      if (categoryName === "Left" || categoryName === "Right") {
        return categoryName;
      }

      return "";
    }

    function getHandednessName(results, handIndex) {
      const handednessList =
        results.handednesses ??
        results.handedness ??
        [];

      const category = handednessList[handIndex]?.[0];

      return normalizeHandName(
        category?.categoryName ??
        category?.displayName ??
        ""
      );
    }

    function getPinchStateKey(handName, tipIndex) {
      return `${handName}:${tipIndex}`;
    }

    function getPinchState(handName, tipIndex) {
      const key = getPinchStateKey(handName, tipIndex);

      if (!state.pinchStates.has(key)) {
        state.pinchStates.set(key, {
          active: false,
          stableCount: 0
        });
      }

      return state.pinchStates.get(key);
    }

    function updatePinches(handName, landmarks) {
      const assignments = CONFIG.assignments[handName] ?? [];
      const palmScale = getPalmScale(landmarks);
      const thumbTip = landmarks[4];

      const candidates = assignments
        .filter((assignment) => assignment.word)
        .map((assignment) => ({
          ...assignment,
          ratio:
            distance3D(thumbTip, landmarks[assignment.tip]) /
            palmScale
        }))
        .sort((a, b) => a.ratio - b.ratio);

      const nearest = candidates[0] ?? null;

      candidates.forEach((candidate) => {
        const pinchState = getPinchState(
          handName,
          candidate.tip
        );

        const isNearest =
          nearest &&
          nearest.tip === candidate.tip;

        if (
          isNearest &&
          candidate.ratio <= CONFIG.pinchOnRatio
        ) {
          if (!pinchState.active) {
            pinchState.stableCount += 1;

            if (
              pinchState.stableCount >= CONFIG.stableFrames
            ) {
              pinchState.active = true;
              pinchState.stableCount = 0;
              selectWord(candidate.word);
            }
          }
        } else if (
          candidate.ratio >= CONFIG.pinchOffRatio
        ) {
          pinchState.active = false;
          pinchState.stableCount = 0;
        } else if (!isNearest && !pinchState.active) {
          pinchState.stableCount = 0;
        }
      });

      return nearest;
    }

    function selectWord(word) {
      if (!word || state.completing) {
        return;
      }

      if (!CONFIG.endlessMode) {
        state.activatedWords.add(word);
        updateProgress();
      }

      showSelectedWord(word);

      let ttsWord = word;
      let lang = "en-US";

      if (word === "hooonkyu") {
        ttsWord = "훈규";
        lang = "ko-KR";
      }

      setAudioSessionType("playback");

      const utterance = new SpeechSynthesisUtterance(ttsWord);
      utterance.lang = lang;
      utterance.volume = CONFIG.ttsVolume;
      utterance.rate = 1;
      utterance.pitch = 1;
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      window.speechSynthesis.speak(utterance);

      playFlash();
      spawnParticles(12);

      if (navigator.vibrate) {
        navigator.vibrate(32);
      }

      if (!CONFIG.endlessMode) {
        if (
          state.activatedWords.size === CONFIG.allWords.length
        ) {
          state.completing = true;

          clearTimeout(state.completeTimer);

          state.completeTimer = setTimeout(
            completeExperience,
            CONFIG.completeDelayMs
          );
        }
      }
    }

    function showSelectedWord(word) {
      clearTimeout(state.selectedWordTimer);

      elements.selectedWord.textContent = word;
      elements.selectedWord.classList.remove("show");
      void elements.selectedWord.offsetWidth;
      elements.selectedWord.classList.add("show");

      state.selectedWordTimer = setTimeout(() => {
        elements.selectedWord.classList.remove("show");
      }, 920);
    }

    function updateProgress() {
      elements.wordChips.forEach((chip) => {
        chip.classList.toggle(
          "active",
          state.activatedWords.has(chip.dataset.word)
        );
      });

      const percentage =
        state.activatedWords.size /
        CONFIG.allWords.length *
        100;

      elements.progressFill.style.width = `${percentage}%`;
    }

    function drawResults(results) {
      clearOverlay();

      const landmarksList = results.landmarks ?? [];
      state.detectedHands = landmarksList.length;
      state.latestHandResults = [];

      if (!landmarksList.length) {
        refreshRecordingOverlay();
        return;
      }

      const metrics = getDisplayMetrics();

      landmarksList.forEach((landmarks, handIndex) => {
        const handName = getHandednessName(
          results,
          handIndex
        );

        if (!handName) {
          return;
        }

        const nearest = updatePinches(
          handName,
          landmarks
        );

        state.latestHandResults.push({
          handName,
          landmarks: landmarks.map((landmark) => ({
            x: landmark.x,
            y: landmark.y,
            z: landmark.z || 0
          })),
          nearest: nearest
            ? { ...nearest }
            : null
        });

        drawHandSkeleton(
          landmarks,
          metrics,
          nearest
        );

        drawFingerAssignments(
          handName,
          landmarks,
          metrics,
          nearest
        );
      });

      refreshRecordingOverlay();
    }

    function drawHandSkeleton(
      landmarks,
      metrics,
      nearest
    ) {
      overlayContext.save();
      overlayContext.lineCap = "round";
      overlayContext.lineJoin = "round";
      overlayContext.lineWidth = 1.4;
      overlayContext.strokeStyle =
        "rgba(101, 233, 255, 0.34)";

      HAND_CONNECTIONS.forEach(([startIndex, endIndex]) => {
        const start = landmarkToScreen(
          landmarks[startIndex],
          metrics
        );

        const end = landmarkToScreen(
          landmarks[endIndex],
          metrics
        );

        overlayContext.beginPath();
        overlayContext.moveTo(start.x, start.y);
        overlayContext.lineTo(end.x, end.y);
        overlayContext.stroke();
      });

      landmarks.forEach((landmark, index) => {
        const point = landmarkToScreen(
          landmark,
          metrics
        );

        overlayContext.beginPath();
        overlayContext.arc(
          point.x,
          point.y,
          index === 4 ? 3.6 : 2.1,
          0,
          Math.PI * 2
        );

        overlayContext.fillStyle =
          index === 4
            ? "rgba(255, 255, 255, 0.92)"
            : "rgba(101, 233, 255, 0.54)";

        overlayContext.fill();
      });

      if (nearest) {
        const thumb = landmarkToScreen(
          landmarks[4],
          metrics
        );

        const finger = landmarkToScreen(
          landmarks[nearest.tip],
          metrics
        );

        const proximity = Math.max(
          0,
          Math.min(
            1,
            1 -
            nearest.ratio /
            CONFIG.pinchOffRatio
          )
        );

        overlayContext.beginPath();
        overlayContext.moveTo(thumb.x, thumb.y);
        overlayContext.lineTo(finger.x, finger.y);
        overlayContext.lineWidth = 2 + proximity * 2;
        overlayContext.strokeStyle =
          `rgba(255, 255, 255, ${0.12 + proximity * 0.65})`;
        overlayContext.stroke();
      }

      overlayContext.restore();
    }

    function drawFingerAssignments(
      handName,
      landmarks,
      metrics,
      nearest
    ) {
      const assignments =
        CONFIG.assignments[handName] ?? [];

      assignments.forEach((assignment) => {
        if (!assignment.word) {
          return;
        }

        const tipPoint = landmarkToScreen(
          landmarks[assignment.tip],
          metrics
        );

        const isNearest =
          nearest &&
          nearest.tip === assignment.tip;

        const isClose =
          isNearest &&
          nearest.ratio <= CONFIG.pinchOffRatio;

        drawFingerDot(
          tipPoint,
          assignment.color,
          isClose
        );

        drawFingerLabel(
          tipPoint,
          assignment.word,
          assignment.color,
          isClose
        );
      });
    }

    function drawFingerDot(point, color, active) {
      overlayContext.save();

      if (active) {
        overlayContext.beginPath();
        overlayContext.arc(
          point.x,
          point.y,
          11,
          0,
          Math.PI * 2
        );
        overlayContext.fillStyle = color + "30";
        overlayContext.fill();
      }

      overlayContext.beginPath();
      overlayContext.arc(
        point.x,
        point.y,
        active ? 5.8 : 4.4,
        0,
        Math.PI * 2
      );

      overlayContext.fillStyle = "#ff314f";
      overlayContext.shadowColor = color;
      overlayContext.shadowBlur = active ? 18 : 9;
      overlayContext.fill();

      overlayContext.restore();
    }

    function drawFingerLabel(
      point,
      text,
      color,
      active
    ) {
      overlayContext.save();

      const fontSize =
        Math.max(
          13,
          Math.min(19, state.overlayWidth * 0.044)
        );

      overlayContext.font =
        `700 ${fontSize}px "Helvetica Neue", Arial, sans-serif`;

      overlayContext.textAlign = "center";
      overlayContext.textBaseline = "bottom";
      overlayContext.fillStyle = color;
      
      /* 그림자 및 테두리 숨김
      overlayContext.shadowColor =
        "rgba(0, 0, 0, 0.82)";
      overlayContext.shadowBlur = 8;
      overlayContext.lineWidth = active ? 4 : 3;
      overlayContext.strokeStyle =
        "rgba(4, 4, 8, 0.72)";
      */

      const y = point.y - (active ? 14 : 11);

      /*
      overlayContext.strokeText(
        text,
        point.x,
        y
      );
      */

      overlayContext.fillText(
        text,
        point.x,
        y
      );

      overlayContext.restore();
    }

    function refreshRecordingOverlay() {
      const targetWidth = elements.recordingOverlayCanvas.width;
      const targetHeight = elements.recordingOverlayCanvas.height;

      if (!targetWidth || !targetHeight) {
        return;
      }

      recordingOverlayContext.clearRect(
        0,
        0,
        targetWidth,
        targetHeight
      );

      drawRecordingHandResults(targetWidth, targetHeight);
    }

    function getRecordingDisplayMetrics(targetWidth, targetHeight) {
      const videoWidth = elements.camera.videoWidth;
      const videoHeight = elements.camera.videoHeight;

      const scale = Math.max(
        targetWidth / videoWidth,
        targetHeight / videoHeight
      );

      const renderedWidth = videoWidth * scale;
      const renderedHeight = videoHeight * scale;

      return {
        renderedWidth,
        renderedHeight,
        offsetX: (targetWidth - renderedWidth) / 2,
        offsetY: (targetHeight - renderedHeight) / 2
      };
    }

    function recordingLandmarkToCanvas(landmark, metrics) {
      return {
        x: metrics.offsetX + landmark.x * metrics.renderedWidth,
        y: metrics.offsetY + landmark.y * metrics.renderedHeight
      };
    }

    function drawRecordingHandResults(targetWidth, targetHeight) {
      if (!state.latestHandResults.length) {
        return;
      }

      const metrics = getRecordingDisplayMetrics(
        targetWidth,
        targetHeight
      );

      state.latestHandResults.forEach(({
        handName,
        landmarks,
        nearest
      }) => {
        drawRecordingHandSkeleton(
          landmarks,
          metrics,
          nearest,
          targetWidth
        );
        drawRecordingFingerAssignments(
          handName,
          landmarks,
          metrics,
          nearest,
          targetWidth
        );
      });
    }

    function drawRecordingHandSkeleton(
      landmarks,
      metrics,
      nearest,
      targetWidth
    ) {
      const widthScale = Math.max(
        1,
        targetWidth / Math.max(state.overlayWidth, 1)
      );

      recordingOverlayContext.save();
      recordingOverlayContext.lineCap = "round";
      recordingOverlayContext.lineJoin = "round";
      recordingOverlayContext.lineWidth = 1.4 * widthScale;
      recordingOverlayContext.strokeStyle =
        "rgba(101, 233, 255, 0.34)";

      HAND_CONNECTIONS.forEach(([startIndex, endIndex]) => {
        const start = recordingLandmarkToCanvas(
          landmarks[startIndex],
          metrics
        );
        const end = recordingLandmarkToCanvas(
          landmarks[endIndex],
          metrics
        );

        recordingOverlayContext.beginPath();
        recordingOverlayContext.moveTo(start.x, start.y);
        recordingOverlayContext.lineTo(end.x, end.y);
        recordingOverlayContext.stroke();
      });

      landmarks.forEach((landmark, index) => {
        const point = recordingLandmarkToCanvas(
          landmark,
          metrics
        );

        recordingOverlayContext.beginPath();
        recordingOverlayContext.arc(
          point.x,
          point.y,
          (index === 4 ? 3.6 : 2.1) * widthScale,
          0,
          Math.PI * 2
        );
        recordingOverlayContext.fillStyle =
          index === 4
            ? "rgba(255, 255, 255, 0.92)"
            : "rgba(101, 233, 255, 0.54)";
        recordingOverlayContext.fill();
      });

      if (nearest) {
        const thumb = recordingLandmarkToCanvas(
          landmarks[4],
          metrics
        );
        const finger = recordingLandmarkToCanvas(
          landmarks[nearest.tip],
          metrics
        );
        const proximity = Math.max(
          0,
          Math.min(
            1,
            1 - nearest.ratio / CONFIG.pinchOffRatio
          )
        );

        recordingOverlayContext.beginPath();
        recordingOverlayContext.moveTo(thumb.x, thumb.y);
        recordingOverlayContext.lineTo(finger.x, finger.y);
        recordingOverlayContext.lineWidth =
          (2 + proximity * 2) * widthScale;
        recordingOverlayContext.strokeStyle =
          `rgba(255, 255, 255, ${0.12 + proximity * 0.65})`;
        recordingOverlayContext.stroke();
      }

      recordingOverlayContext.restore();
    }

    function drawRecordingFingerAssignments(
      handName,
      landmarks,
      metrics,
      nearest,
      targetWidth
    ) {
      const assignments = CONFIG.assignments[handName] ?? [];
      const widthScale = Math.max(
        1,
        targetWidth / Math.max(state.overlayWidth, 1)
      );

      assignments.forEach((assignment) => {
        if (!assignment.word) {
          return;
        }

        const point = recordingLandmarkToCanvas(
          landmarks[assignment.tip],
          metrics
        );
        const isNearest =
          nearest && nearest.tip === assignment.tip;
        const isClose =
          isNearest && nearest.ratio <= CONFIG.pinchOffRatio;

        recordingOverlayContext.save();

        if (isClose) {
          recordingOverlayContext.beginPath();
          recordingOverlayContext.arc(
            point.x,
            point.y,
            11 * widthScale,
            0,
            Math.PI * 2
          );
          recordingOverlayContext.fillStyle = assignment.color + "30";
          recordingOverlayContext.fill();
        }

        recordingOverlayContext.beginPath();
        recordingOverlayContext.arc(
          point.x,
          point.y,
          (isClose ? 5.8 : 4.4) * widthScale,
          0,
          Math.PI * 2
        );
        recordingOverlayContext.fillStyle = "#ff314f";
        recordingOverlayContext.shadowColor = assignment.color;
        recordingOverlayContext.shadowBlur =
          (isClose ? 18 : 9) * widthScale;
        recordingOverlayContext.fill();
        recordingOverlayContext.restore();

        recordingOverlayContext.save();
        const fontSize = Math.max(
          13 * widthScale,
          Math.min(19 * widthScale, targetWidth * 0.044)
        );
        recordingOverlayContext.font =
          `700 ${fontSize}px "Helvetica Neue", Arial, sans-serif`;
        recordingOverlayContext.textAlign = "center";
        recordingOverlayContext.textBaseline = "bottom";
        recordingOverlayContext.fillStyle = assignment.color;
        
        /* 그림자 및 테두리 숨김
        recordingOverlayContext.shadowColor =
          "rgba(0, 0, 0, 0.82)";
        recordingOverlayContext.shadowBlur = 8 * widthScale;
        recordingOverlayContext.lineWidth =
          (isClose ? 4 : 3) * widthScale;
        recordingOverlayContext.strokeStyle =
          "rgba(4, 4, 8, 0.72)";
        */

        const y =
          point.y - (isClose ? 14 : 11) * widthScale;

        /*
        recordingOverlayContext.strokeText(
          assignment.word,
          point.x,
          y
        );
        */
       
        recordingOverlayContext.fillText(
          assignment.word,
          point.x,
          y
        );
        recordingOverlayContext.restore();
      });
    }

    async function inferenceLoop(timestamp) {
      if (!state.running) {
        return;
      }

      requestAnimationFrame(inferenceLoop);

      if (state.geometryWarmupFrames > 0) {
        if (state.geometryWarmupFrames % 3 === 0) {
          syncCameraGeometry();
        }

        state.geometryWarmupFrames -= 1;
      }

      if (
        state.inferenceBusy ||
        timestamp - state.lastInferenceAt <
          CONFIG.inferenceIntervalMs ||
        elements.camera.readyState < 2 ||
        elements.camera.currentTime === state.lastVideoTime
      ) {
        return;
      }

      state.inferenceBusy = true;
      state.lastInferenceAt = timestamp;
      state.lastVideoTime = elements.camera.currentTime;

      try {
        if (!drawMirroredInferenceFrame()) {
          return;
        }

        const results =
          state.landmarker.detectForVideo(
            elements.inferenceCanvas,
            timestamp
          );

        drawResults(results);
      } catch (error) {
        console.error(error);
      } finally {
        state.inferenceBusy = false;
      }
    }

    async function startExperience() {
      elements.startButton.disabled = true;
      elements.startButton.querySelector("span").textContent = TEXT_CONFIG.loadingText;
      syncResultMode();

      try {
        await Promise.all([
          createHandLandmarker(),
          startCamera()
        ]);

        requestWakeLock(); 

        resetSelection();
        showScreen("experience");

        state.running = true;

        requestAnimationFrame(inferenceLoop);
        await startRecording();
      } catch (error) {
        console.error(error);

        const message =
          error?.name === "NotAllowedError"
            ? "카메라와 마이크 권한이 필요합니다. 브라우저 설정에서 모두 허용해 주세요."
            : error?.message ?? "시작할 수 없습니다.";

        stopCamera();
        showToast(message, 4800);
      } finally {
        elements.startButton.disabled = false;
        elements.startButton.querySelector("span").textContent = TEXT_CONFIG.startBtn;
      }
    }

    function resetSelection() {
      state.activatedWords.clear();
      state.pinchStates.clear();
      state.completing = false;
      state.detectedHands = 0;
      state.latestHandResults = [];
      refreshRecordingOverlay();

      clearTimeout(state.selectedWordTimer);
      clearTimeout(state.completeTimer);
      state.completeTimer = null;

      elements.selectedWord.classList.remove("show");
      elements.selectedWord.textContent = "";

      if (!CONFIG.endlessMode) {
        updateProgress();
      }
      clearOverlay();
    }

    function resetWhileRunning() {
      const shouldRestartLoop = !state.running;

      resetSelection();
      showScreen("experience");

      if (state.stream && state.landmarker) {
        state.running = true;

        if (shouldRestartLoop) {
          requestAnimationFrame(inferenceLoop);
        }

        startRecording();
      }
    }

    async function completeExperience() {
      state.running = false;
      clearOverlay();
      showScreen("complete");
      spawnParticles(48);
      playFlash();
      await stopRecording();
    }

    function playFlash() {
      elements.flash.classList.remove("play");
      void elements.flash.offsetWidth;
      elements.flash.classList.add("play");
    }

    function spawnParticles(count = 24) {
      const colors = [
        "#ff5f9e",
        "#9879ff",
        "#65e9ff",
        "#fff4cb",
        "#ffffff"
      ];

      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight * 0.47;

      for (let index = 0; index < count; index++) {
        const particle = document.createElement("i");
        const angle = Math.random() * Math.PI * 2;
        const distance =
          80 +
          Math.random() *
          Math.min(260, window.innerWidth * 0.62);

        particle.className = "particle";
        particle.style.background =
          colors[
            Math.floor(Math.random() * colors.length)
          ];

        particle.style.setProperty(
          "--x0",
          `${centerX}px`
        );

        particle.style.setProperty(
          "--y0",
          `${centerY}px`
        );

        particle.style.setProperty(
          "--x1",
          `${centerX + Math.cos(angle) * distance}px`
        );

        particle.style.setProperty(
          "--y1",
          `${centerY + Math.sin(angle) * distance}px`
        );

        particle.style.setProperty(
          "--rot",
          `${Math.round(Math.random() * 720 - 360)}deg`
        );

        particle.style.setProperty(
          "--duration",
          `${700 + Math.random() * 720}ms`
        );

        document.body.appendChild(particle);

        particle.addEventListener(
          "animationend",
          () => particle.remove()
        );
      }
    }

    function stopCamera() {
      state.running = false;
      elements.app.classList.remove("camera-mode");
      elements.recordControls.classList.add("hidden");
      setAudioSessionType("auto");

      cancelRecordingFrameLoop();

      if (state.mediaRecorder?.state === "recording") {
        try {
          state.mediaRecorder.stop();
        } catch (error) {
          console.warn(error);
        }
      } else {
      }

      if (!state.stream) {
        return;
      }

      state.stream
        .getTracks()
        .forEach((track) => track.stop());

      state.stream = null;
      elements.camera.srcObject = null;
      elements.cameraLayer.classList.remove("active");
    }

    elements.startButton.addEventListener(
      "click",
      startExperience
    );

    elements.restartButton.addEventListener(
      "click",
      resetWhileRunning
    );

    elements.resultToggle.addEventListener(
      "change",
      syncResultMode
    );

    elements.recordButton.addEventListener(
      "click",
      stopAndDownloadRecording
    );

    elements.saveRecordingButton.addEventListener(
      "click",
      downloadRecording
    );

    window.addEventListener(
      "resize",
      () => {
        syncCameraGeometry(true);
        state.geometryWarmupFrames = 8;
      }
    );

    window.visualViewport?.addEventListener(
      "resize",
      () => {
        syncCameraGeometry(true);
        state.geometryWarmupFrames = 8;
      }
    );

    window.addEventListener(
      "orientationchange",
      () => {
        setTimeout(() => {
          syncCameraGeometry(true);
          state.geometryWarmupFrames = 12;
        }, 280);
      }
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (document.hidden) {
          state.running = false;
          return;
        }

        requestWakeLock();
        setAudioSessionType("playback");
        syncCameraGeometry(true);
        state.geometryWarmupFrames = 8;

        if (
          state.stream &&
          state.landmarker &&
          !state.completing
        ) {
          state.running = true;
          requestAnimationFrame(inferenceLoop);
        }
      }
    );

    window.addEventListener("pagehide", stopCamera);

    syncResultMode();
    resizeOverlay();
    
    // 페이지 진입 시 자동으로 카메라를 시작하도록 함수 호출을 추가함
    startExperience();
  </script>
</body>
</html>
